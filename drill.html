<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPAS 分類記憶練習</title>
<style>
:root{--bg:#0f1117;--sur:#161b22;--card:#1c2128;--bdr:#30363d;--acc:#4493f8;--grn:#3fb950;--red:#f85149;--ylw:#d29922;--txt:#e6edf3;--mut:#7d8590;--r:10px;
--f0:#4493f8;--f1:#3fb950;--f2:#d29922;--f3:#a371f7;--f4:#f778ba;--f5:#39c5cf;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:.8rem 1.2rem;display:flex;align-items:center;gap:.8rem;position:sticky;top:0;z-index:5}
.logo{font-weight:700;font-size:.95rem}
.hdr a{margin-left:auto;color:var(--mut);font-size:.82rem;text-decoration:none}
.hdr a:hover{color:var(--txt)}
.wrap{max-width:760px;margin:0 auto;padding:1.4rem 1rem 3rem}
.intro h1{font-size:1.45rem;font-weight:700;margin-bottom:.3rem}
.intro p{color:var(--mut);font-size:.9rem;max-width:36em}
.subj{margin-top:1.8rem}
.subj h2{font-size:1rem;font-weight:600;margin-bottom:.6rem;color:var(--mut)}
.deck{border:1px solid var(--bdr);background:var(--sur);border-radius:var(--r);padding:.9rem 1rem;margin-bottom:.6rem}
.deck-top{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.deck-top b{font-size:1rem}
.deck-top span{font-size:.8rem;color:var(--mut)}
.tip{font-size:.82rem;color:var(--mut);margin:.25rem 0 .55rem}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.65rem}
.dot{width:12px;height:12px;border-radius:3px;background:var(--card);border:1px solid var(--bdr)}
.dot.s1{background:rgba(63,185,80,.35);border-color:rgba(63,185,80,.5)}
.dot.s2{background:var(--grn);border-color:var(--grn)}
.acts{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{border:1px solid var(--bdr);background:var(--card);border-radius:8px;padding:.45rem .85rem;font-size:.85rem}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.2rem}
.view{display:none}.view.on{display:block}
.back{color:var(--mut);font-size:.85rem;background:none;border:none;margin-bottom:1rem}
.back:hover{color:var(--txt)}
.vt{font-size:1.25rem;font-weight:700}
.vtip{background:var(--sur);border:1px solid var(--bdr);border-left:3px solid var(--acc);border-radius:6px;padding:.6rem .8rem;font-size:.88rem;margin:.6rem 0 1.2rem}
.fam{margin-bottom:1.1rem}
.fam h3{font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:.45rem;margin-bottom:.35rem}
.fam h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.row{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:.2rem 1rem;padding:.55rem .1rem;border-top:1px solid var(--bdr);font-size:.88rem}
.row .n{font-weight:600}
.row .a{color:var(--txt)}
.row .k{grid-column:2;color:var(--mut);font-size:.8rem}
@media(max-width:560px){.row{grid-template-columns:1fr}.row .k{grid-column:1}}
.qtop{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);margin-bottom:.6rem}
.prog{height:4px;background:var(--card);border-radius:2px;margin-bottom:1rem;overflow:hidden}
.prog div{height:100%;background:var(--acc);transition:width .2s}
.qcard{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:1.3rem 1.1rem;text-align:center;margin-bottom:.9rem}
.qhint{font-size:.78rem;color:var(--mut);margin-bottom:.4rem}
.qtext{font-size:1.15rem;font-weight:600;line-height:1.55}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.5rem}
.opt{border:1px solid var(--bdr);background:var(--card);border-radius:8px;padding:.7rem .8rem;text-align:left;font-size:.9rem}
.opt:hover:not(:disabled){border-color:var(--mut)}
.opt.ok{border-color:var(--grn);color:var(--grn);font-weight:600}
.opt.no{border-color:var(--red);color:var(--red)}
.opt:disabled{cursor:default}
.fb{margin-top:1rem;background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:.85rem 1rem;font-size:.9rem;display:none}
.fb .v{font-weight:700;margin-bottom:.3rem}
.fb .v.ok{color:var(--grn)}.fb .v.no{color:var(--red)}
.chip{display:inline-block;font-size:.78rem;border-radius:5px;padding:.05rem .5rem;margin:.15rem .3rem .15rem 0;border:1px solid var(--bdr)}
.fb .btn{margin-top:.7rem}
.res{text-align:center;padding:1rem 0}
.res .big{font-size:2.2rem;font-weight:700}
.res p{color:var(--mut);font-size:.9rem}
.wl{margin-top:1rem;text-align:left}
.wl div{border-top:1px solid var(--bdr);padding:.5rem .1rem;font-size:.88rem}
.wl b{font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="hdr"><span class="logo">iPAS 分類記憶練習</span><a href="./">回題庫</a></div>
<div class="wrap">
<section class="view on" id="home">
<div class="intro"><h1>看到名字，就說得出它在做什麼</h1>

<div class="bar"><button class="btn pri" id="mixWrong">練所有還沒記住的</button><button class="btn" id="reset">清除進度</button></div>
<div id="decks"></div>
</section>
<section class="view" id="study"><button class="back" data-go="home">回牌組列表</button><div id="studyBody"></div></section>
<section class="view" id="quiz"><button class="back" data-go="home">結束練習</button><div id="quizBody"></div></section>
</div>

const KEY='ipas-drill-v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const id=(d,it)=>d.id+'|'+it[0];
const lvl=k=>Math.min(S[k]||0,2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const FC=['var(--f0)','var(--f1)','var(--f2)','var(--f3)','var(--f4)','var(--f5)'];
function famsOf(d){const f=[];d.items.forEach(it=>{if(!f.includes(it[4]))f.push(it[4])});return f}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));window.scrollTo(0,0)}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{renderHome();show(b.dataset.go)});
function renderHome(){
const box=document.getElementById('decks');let h='';
['科目一','科目二'].forEach(sj=>{
h+='<div class="subj"><h2>'+sj+'</h2>';
DECKS.filter(d=>d.subj===sj).forEach(d=>{
const m=d.items.filter(it=>lvl(id(d,it))>=2).length;
h+='<div class="deck"><div class="deck-top"><b>'+esc(d.title)+'</b><span>記住 '+m+' / '+d.items.length+'</span></div>'+
'<div class="tip">'+esc(d.tip)+'</div><div class="dots">'+d.items.map(it=>'<span class="dot s'+lvl(id(d,it))+'" title="'+esc(it[0])+'"></span>').join('')+'</div>'+
'<div class="acts"><button class="btn" data-study="'+d.id+'">看家族表</button><button class="btn pri" data-quiz="'+d.id+'">練習</button></div></div>';});
h+='</div>';});
box.innerHTML=h;
box.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>study(b.dataset.study));
box.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>startDeck(b.dataset.quiz));}
function study(did){const d=DECKS.find(x=>x.id===did),f=famsOf(d);
let h='<div class="vt">'+esc(d.subj)+'｜'+esc(d.title)+'</div><div class="vtip">口訣：'+esc(d.tip)+'</div>';
f.forEach((fm,i)=>{h+='<div class="fam"><h3><i style="background:'+FC[i%6]+'"></i>'+esc(fm)+'</h3>';
d.items.filter(it=>it[4]===fm).forEach(it=>{h+='<div class="row"><div class="n">'+esc(it[0])+'</div><div class="a">'+esc(it[1])+'</div><div class="k">例：'+esc(it[2])+'　關鍵字：'+esc(it[3])+'</div></div>'});h+='</div>'});
h+='<div class="bar"><button class="btn pri" id="goQuiz">看完了，開始練習</button></div>';
document.getElementById('studyBody').innerHTML=h;document.getElementById('goQuiz').onclick=()=>startDeck(did);show('study');}
let Q=null;
function build(pairs){
const unm=shuffle(pairs.filter(p=>lvl(id(p.d,p.it))<2)),mas=shuffle(pairs.filter(p=>lvl(id(p.d,p.it))>=2));
return unm.concat(mas).slice(0,15).map(p=>({...p,mode:Math.random()<.5?'name':'scene'}));}
function startDeck(did){const d=DECKS.find(x=>x.id===did);startList(build(d.items.map(it=>({d,it}))),d.title);}
function startList(list,title){if(!list.length){alert('目前沒有需要練習的題目');return}Q={list,i:0,sc:0,wrong:[],title};ask();show('quiz');}
function ask(){const q=Q.list[Q.i],d=q.d,it=q.it,fi=famsOf(d).indexOf(it[4]);
let ans,pool,hint,text;
if(q.mode==='name'){hint='這個在做什麼？';text=it[0];ans=it[1];pool=d.items.filter(x=>x!==it).map(x=>x[1]);}
else{hint='這個情境該用哪一個？';text=it[2];ans=it[0];pool=d.items.filter(x=>x!==it).map(x=>x[0]);}
const ch=shuffle([ans].concat(shuffle(pool).slice(0,3)));
let h='<div class="qtop"><span>'+esc(Q.title)+'</span><span>第 '+(Q.i+1)+' / '+Q.list.length+' 題　答對 '+Q.sc+'</span></div>'+
'<div class="prog"><div style="width:'+(Q.i/Q.list.length*100)+'%"></div></div>'+
'<div class="qcard"><div class="qhint">'+hint+'</div><div class="qtext">'+esc(text)+'</div></div><div class="opts">'+
ch.map((c,k)=>'<button class="opt" data-k="'+k+'">'+esc(c)+'</button>').join('')+'</div><div class="fb" id="fb"></div>';
const body=document.getElementById('quizBody');body.innerHTML=h;
body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(ch[+b.dataset.k],ans,b,fi));}
function pick(t,ans,btn,fi){const q=Q.list[Q.i],it=q.it,k=id(q.d,it),r=t===ans;
document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add('ok')});
if(r){Q.sc++;S[k]=(S[k]||0)+1}else{btn.classList.add('no');S[k]=0;Q.wrong.push(q)}
save();
const fb=document.getElementById('fb');fb.style.display='block';
fb.innerHTML='<div class="v '+(r?'ok':'no')+'">'+(r?'答對了':'正解：'+esc(ans))+'</div>'+
'<div><b>'+esc(it[0])+'</b>：'+esc(it[1])+'</div><div style="color:var(--mut);font-size:.85rem">例：'+esc(it[2])+'</div>'+
'<div><span class="chip" style="border-color:'+FC[fi%6]+';color:'+FC[fi%6]+'">家族：'+esc(it[4])+'</span><span class="chip">關鍵字：'+esc(it[3])+'</span></div>'+
'<button class="btn pri" id="next">'+(Q.i<Q.list.length-1?'下一題':'看結果')+'</button>';
const n=document.getElementById('next');n.onclick=next;n.focus();}
function next(){Q.i++;if(Q.i<Q.list.length)ask();else result();}
function result(){const w=Q.wrong;
let h='<div class="res"><div class="big">'+Q.sc+' / '+Q.list.length+'</div><p>'+(w.length?'把下面這幾個再看一次，再練一輪':'全對，這組已經很熟了')+'</p></div>';
if(w.length){h+='<div class="wl">'+w.map(q=>'<div><b>'+esc(q.it[0])+'</b>：'+esc(q.it[1])+'<br><span style="color:var(--mut);font-size:.82rem">家族：'+esc(q.it[4])+'　關鍵字：'+esc(q.it[3])+'</span></div>').join('')+'</div>'}
h+='<div class="bar">'+(w.length?'<button class="btn pri" id="redo">只練答錯的</button>':'')+'<button class="btn" id="again">再練一輪</button><button class="btn" id="home2">回牌組列表</button></div>';
document.getElementById('quizBody').innerHTML=h;
const title=Q.title,list=Q.list;
if(w.length)document.getElementById('redo').onclick=()=>startList(shuffle(w).map(q=>({...q,mode:q.mode==='name'?'scene':'name'})),title);
document.getElementById('again').onclick=()=>startList(build(list.map(q=>({d:q.d,it:q.it}))),title);
document.getElementById('home2').onclick=()=>{renderHome();show('home')};}
document.getElementById('mixWrong').onclick=()=>{const all=[];DECKS.forEach(d=>d.items.forEach(it=>{if(lvl(id(d,it))<2)all.push({d,it})}));startList(build(all),'還沒記住的混合練習');};
document.getElementById('reset').onclick=()=>{if(confirm('確定要清除所有練習進度？')){S={};save();renderHome()}};
renderHome();
</script></body></html>
